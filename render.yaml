databases:
  - name: finplay-db
    plan: free
    databaseName: finplay_arcade
    user: finplay_user

services:
  - type: web
    name: finplay-arcade
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finplay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: FinPlay Admin
      - key: DEFAULT_MAX_ATTEMPTS
        value: "3"
